<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Seedless Vascular Plants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Nunito+Sans:wght@400;700&display=swap"
        rel="stylesheet">
    <link href="quiz.css" rel="stylesheet">
</head>

<body>
    <div class="topbar"><span class="brand fs-4 text-white">🌿 Quiz time</span><a href="index.html">◀ Back to
            Home</a>
    </div>
  
    
    <div class="container" style="max-width:980px">

    <div class="mt-4 text-white d-flex justify-content-between align-items-center">
        <span id="counter"></span>

        <div>
            <span id="timer" style="color:yellow; font-size:30px; font-weight:bold;">30</span>
            <button onclick="startTimer()" 
                style="background-color:green; color:white; padding:8px 18px; border:none; border-radius:5px; cursor:pointer; margin-left:10px;">
                Start Quiz
            </button>
        </div>

        <span id="scoreLive"></span>
    </div>

    <div class="bar mt-2">
        <div id="prog" style="width:0"></div>
    </div>

    <div class="qcard" id="card"></div>

</div>


</body>
<script type="module" src="main.js"> </script>
</html>
